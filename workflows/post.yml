name: Auto Post

on:
  schedule:
    # Wqt b UTC. Maroc (UTC+1): 08:00 w 17:00 -> baddal hsb 3jbk
    - cron: "0 7 * * *"
    - cron: "0 16 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Tjrba bla ma tposti (1 = yes)"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: auto-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run poster
        env:
          PAGE_ACCESS_TOKEN: ${{ secrets.PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
        run: python scripts/post.py

      - name: Commit changes
        if: always()
        run: |
          git config user.name "auto-poster"
          git config user.email "auto-poster@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "auto-post: update posts" && git pull --rebase && git push)
